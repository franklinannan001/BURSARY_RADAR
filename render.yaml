services:
  - type: web
    name: bursary-radar
    runtime: python
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: "0"
      - key: ADMIN_TOKEN
        sync: false
      - key: APPLICATION_DOCUMENT_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        value: https://jrxjzk.api.infobip.com
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_SENDER_ID
        value: BursaryRadar
